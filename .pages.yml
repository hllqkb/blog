# Pages CMS 配置：在 https://app.pagescms.org 用 GitHub 登录后编辑本仓库，保存即提交并自动发布。
# 文档：https://pagescms.org/docs/configuration/

# 图片存仓库 public/images/posts，本地预览可用；
# 发布时由 deploy.yml 同步到 R2 并改写地址（仓库变量 IMAGE_CDN_BASE 为空时不改写）
media:
  input: public/images/posts
  output: /blog/images/posts
  # 随机文件名：同名图片不会互相覆盖，R2 上可以放心长期缓存
  rename: random
  categories: [image]

content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    filename:
      template: "{year}-{month}-{day}-{fields.slug}.md"
      field: false
    view:
      primary: title
      fields: [title, date, draft]
      sort: [date, title]
      search: [title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: slug
        label: 英文短链
        description: 文章网址 /posts/<短链>/，只写小写英文、数字和连字符，如 my-first-post；发布后不要再改
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: 只能用小写英文、数字和连字符
      - name: date
        label: 发布时间
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: description
        label: 一句话摘要
        type: string
      - name: tags
        label: 标签
        type: string
        list: true
      - name: cover
        label: 封面图
        type: image
      - name: draft
        label: 草稿（勾上就不发布）
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown

settings:
  content:
    # 保存时保留未在上面配置的 front matter 字段（如 source_url）
    merge: true
